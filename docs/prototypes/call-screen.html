<!DOCTYPE html>
<!--
  RISE Franchise Portal — Admin pipeline + call panel prototype (v2)
  Spec: docs/franchise-portal-architecture.md §4.2 (/admin/pipeline) and §6 (call screen)

  v2 (Garrett, 2026-11-06): v1 was too busy. Now:
  - The home is a pipeline board, like Pipedrive, with a Kanban ⇄ List toggle.
  - Clicking a card opens a side panel at 66% width with a floating close button.
  - Inside the panel: ALL INFO on the left, EVERYTHING YOU DO on the right. No third column.

  Borrowed from ~/Downloads/RiseOS - PROTOTYPE FILE.html:
  - :root colour tokens + Inter ............................ top-level :root block
  - Board: .kanban-board, .kanban-col(-header/-title/-count), .lead-card, .lead-avatar,
    .lead-card-action + urgency colours (action-urgent / -upcoming / -checked) ... Leads module
  - Sub-bar with KPIs + .view-toggle (Kanban / Table icons) ............................. Leads module sub-bar
  - 66% record panel sliding from the right, scrim, round white floating close at left:-58px,
    full width + close moves inside under 900px .......................................... #clRecordPanel / .cl-float-x (Conversation Log)
  - .panel-header / .panel-title / .panel-subtitle ...................................... shared panel header
  - Call flow: timer pill, start-session gate, one step at a time, talking-point card,
    Yes/No + choice pills + "capture + Add" chips, Previous / Next ...................... HEALTH SCREENING OVERLAY (.hs-*)
  - Client card gradient + "Answered so far" items ...................................... .hs-client-card / .hs-answered-item

  Content comes from MEETINGS (shaped like content/meetings.ts) and CANDIDATES (fake people).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Franchise Pipeline Prototype</title>
<style>
  @font-face { font-family:'Inter'; font-weight:400; font-display:swap; src:url('https://cdn.jsdelivr.net/fontsource/fonts/inter@5.1.0/latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:500; font-display:swap; src:url('https://cdn.jsdelivr.net/fontsource/fonts/inter@5.1.0/latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; font-display:swap; src:url('https://cdn.jsdelivr.net/fontsource/fonts/inter@5.1.0/latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:700; font-display:swap; src:url('https://cdn.jsdelivr.net/fontsource/fonts/inter@5.1.0/latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:800; font-display:swap; src:url('https://cdn.jsdelivr.net/fontsource/fonts/inter@5.1.0/latin-800-normal.woff2') format('woff2'); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  :root {
    --cream: #F8F4EE; --cream-2: #EFE8E0; --border: #D9CFC5;
    --terra: #C97142; --terra-light: #F59A65; --terra-bg: #FFF1E2;
    --green: #4A9B7F; --green-bg: #EAF5F0; --red: #C24E42; --amber: #B8860B;
    --text-dark: #1A1714; --text-mid: #3D332C; --text-muted: #6B5D52; --text-faint: #A89B91;
    --white: #FFFFFF; --sand: #F3EDE3;
  }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #2B2420; color: var(--text-dark); display: flex; flex-direction: column; }
  button, input, select, textarea { font-family: inherit; }

  /* ── DEMO TOOLBAR (prototype only) ── */
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 14px; background: #2B2420; color: #EFE8E0; font-size: 11px; flex-shrink: 0; }
  .demo b { color: var(--terra-light); letter-spacing: .14em; text-transform: uppercase; font-size: 9px; margin-right: 4px; }
  .demo button { background: #3D332C; color: #F8F4EE; border: 1px solid #5A4D43; border-radius: 7px; padding: 5px 9px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .demo button.on { background: var(--terra); border-color: var(--terra); }
  .demo .sp { flex: 1; }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .stage.framed { padding: 16px 0; }

  .app { container-type: inline-size; container-name: app; position: relative; width: 100%; height: 100%; background: var(--cream); display: flex; flex-direction: column; overflow: hidden; }
  .stage.framed .app { width: 390px; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }

  /* ── TOP NAV + SUB-BAR (Leads module) ── */
  .nav { height: 52px; flex-shrink: 0; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 22px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .22em; color: var(--terra); }
  .brand small { font-size: 9px; letter-spacing: .16em; color: var(--text-muted); font-weight: 700; }
  .nav-tabs { display: flex; gap: 4px; margin-left: 18px; }
  .nav-tab { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 7px 12px; border-radius: 8px; }
  .nav-tab.active { background: var(--cream-2); color: var(--text-dark); font-weight: 700; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .me { width: 30px; height: 30px; border-radius: 50%; background: var(--text-dark); color: white; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .subbar { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 14px; padding: 22px 24px 4px; }
  .sub-title { font-size: 22px; font-weight: 300; color: var(--text-dark); }
  .sub-title strong { font-weight: 800; }
  .kpis { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .kpi-label { font-size: 11px; font-weight: 500; color: var(--text-faint); }
  .kpi-value { font-size: 12px; font-weight: 800; color: var(--text-dark); }
  .kpi-value.red { color: #C0392B; }
  .kpi-dot { color: var(--text-faint); }
  .sub-right { margin-left: auto; display: flex; align-items: center; gap: 8px; align-self: center; }
  .search { height: 34px; width: 200px; border: 1px solid var(--border); border-radius: 9px; background: var(--white); padding: 0 12px; font-size: 12px; outline: none; }
  .search:focus { border-color: var(--terra); }
  .view-toggle { display: flex; align-items: center; background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
  .view-toggle-btn { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .view-toggle-btn:hover { background: var(--cream-2); color: var(--text-dark); }
  .view-toggle-btn.active { background: var(--cream-2); color: var(--text-dark); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

  /* ── KANBAN (Leads module) ── */
  .board { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; padding: 14px 24px 20px; gap: 14px; }
  .col { flex: 0 0 264px; display: flex; flex-direction: column; min-height: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 10px; flex-shrink: 0; }
  .col-num { width: 24px; height: 24px; border-radius: 7px; background: var(--terra-bg); color: var(--terra); font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .col-title { font-size: 13px; font-weight: 700; flex: 1; line-height: 1.2; }
  .col-title small { display: block; font-size: 10.5px; font-weight: 500; color: var(--text-muted); }
  .col-count { font-size: 13px; font-weight: 800; }
  .cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
  .col-empty { border: 1.5px dashed var(--border); border-radius: 12px; padding: 16px; text-align: center; font-size: 11px; color: var(--text-faint); }
  .lead-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, border-color .15s; flex-shrink: 0; }
  .lead-card:hover { box-shadow: 0 4px 16px rgba(61,51,44,.1); border-color: #D4C9BB; }
  .lead-card.sel { border-color: var(--terra); box-shadow: 0 0 0 2px rgba(201,113,66,.25); }
  .lc-body { padding: 13px 14px 0; display: flex; align-items: center; gap: 10px; }
  .lead-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; background: var(--cream-2); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--text-mid); }
  .lead-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .lc-action { display: flex; align-items: center; gap: 6px; padding: 8px 14px; margin-top: 11px; border-top: 1px solid var(--cream-2); font-size: 11.5px; font-weight: 600; }
  .lc-action .chev { margin-left: auto; color: var(--text-faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .a-urgent { color: #C0392B; background: #FEF0EE; } .a-urgent .dot { background: #C0392B; }
  .a-upcoming { color: #6B63D4; background: #F0F0FF; } .a-upcoming .dot { background: #6B63D4; }
  .a-today { color: var(--white); background: #6B63D4; } .a-today .dot { background: var(--white); }
  .a-checked { color: var(--green); background: var(--green-bg); } .a-checked .dot { background: var(--green); }
  .a-normal { color: var(--text-muted); background: var(--cream); } .a-normal .dot { background: #E8A838; }

  /* ── LIST VIEW ── */
  .list { flex: 1; min-height: 0; overflow: auto; padding: 14px 24px 20px; }
  .table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--white); border: 1px solid #EDE4DA; border-radius: 14px; overflow: hidden; }
  .table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--white); position: sticky; top: 0; white-space: nowrap; }
  .table td { padding: 11px 14px; font-size: 12.5px; border-bottom: 1px solid var(--cream-2); white-space: nowrap; }
  .table tr:last-child td { border-bottom: none; }
  .table tbody tr { cursor: pointer; }
  .table tbody tr:hover td { background: var(--cream); }
  .table .nm { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .table .nm .lead-avatar { width: 28px; height: 28px; font-size: 10px; }
  .stage-chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px; background: var(--terra-bg); color: #8A431A; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; }

  /* ── 66% RECORD PANEL (#clRecordPanel) ── */
  .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(61,51,44,.26); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .panel { position: absolute; top: 0; right: 0; bottom: 0; width: 66%; z-index: 25; background: var(--white); transform: translateX(100%); transition: transform .28s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column; }
  .panel.open { transform: none; box-shadow: -24px 0 48px rgba(61,51,44,.12); }
  .float-x { position: absolute; top: 14px; left: -58px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; color: #3D332C; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(26,23,20,.22); transition: transform 120ms, background 140ms; }
  .float-x:hover { background: #F6F1EB; } .float-x:active { transform: scale(.96); }
  .panel:not(.open) .float-x { display: none; }

  .panel-header { background: var(--white); border-bottom: 1px solid var(--border); padding: 13px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .ph-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #F59A65, #C97142); color: white; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .panel-title-block { flex: 1; min-width: 0; }
  .panel-title { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph-acts { display: flex; gap: 6px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--white); color: var(--text-mid); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: var(--cream-2); }
  .icon-btn.meet { background: #EAF5F0; color: #2F5D3F; border-color: rgba(74,155,127,.35); }
  .timer { font-size: 14px; font-weight: 800; background: var(--cream-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; font-variant-numeric: tabular-nums; min-width: 66px; text-align: center; }
  .timer.warn { background: #FFF4D6; border-color: #E8C46A; color: #8A6300; }
  .timer.over { background: #FDE3E0; border-color: rgba(194,78,66,.45); color: var(--red); }
  .timer.idle { color: var(--text-faint); }

  .ptabs { display: none; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ptab { flex: 1; padding: 10px 0; font-size: 12px; font-weight: 700; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .ptab.active { color: var(--terra); border-bottom-color: var(--terra); }
  .ptab .cnt { display: inline-block; min-width: 17px; padding: 1px 5px; margin-left: 4px; border-radius: 100px; background: var(--terra-bg); color: var(--terra); font-size: 10px; }

  .pbody { flex: 1; min-height: 0; display: flex; }

  /* LEFT: info only */
  .info { width: 42%; max-width: 380px; flex-shrink: 0; background: var(--sand); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sec-label { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 4px 0; }
  .kv span:first-child { color: var(--text-muted); }
  .kv span:last-child { font-weight: 700; text-align: right; }
  .bar { height: 6px; border-radius: 6px; background: var(--cream-2); overflow: hidden; margin: 6px 0 2px; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
  .hw-q { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 10px 0 3px; }
  .hw-q:first-child { margin-top: 0; }
  .hw-a { font-size: 12px; line-height: 1.5; background: var(--cream); border-left: 3px solid var(--terra-light); padding: 6px 9px; border-radius: 0 6px 6px 0; }
  .feed { list-style: none; }
  .feed li { font-size: 11.5px; color: var(--text-mid); padding: 4px 0 4px 14px; position: relative; line-height: 1.4; }
  .feed li::before { content: ''; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--terra-light); }
  .feed li small { color: var(--text-faint); margin-left: 4px; }
  .badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 100px; letter-spacing: .04em; }
  .badge.ok { background: var(--green-bg); color: #2F5D3F; }
  .badge.live { background: var(--terra-bg); color: var(--terra); }
  .ans { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; animation: pop .25s ease; }
  @keyframes pop { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ans-q { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; display: flex; justify-content: space-between; gap: 6px; }
  .ans-a { font-size: 12px; font-weight: 500; line-height: 1.4; }
  .dest { font-size: 8px; font-weight: 700; padding: 1px 6px; border-radius: 100px; white-space: nowrap; }
  .dest.fact { background: #E7EEF6; color: #3A5A80; }
  .dest.said { background: var(--terra-bg); color: #8A431A; }
  .empty { font-size: 11px; color: var(--text-faint); line-height: 1.5; }
  details.more summary { list-style: none; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--terra); padding: 2px 0; }
  details.more summary::-webkit-details-marker { display: none; }

  /* RIGHT: what you do */
  .work { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .steps { display: flex; gap: 4px; padding: 12px 22px 0; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .step-pill { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; padding: 5px 9px; border-radius: 8px; border: none; background: none; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .step-pill .n { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); font-size: 9px; display: inline-flex; align-items: center; justify-content: center; }
  .step-pill.done { color: #2F5D3F; } .step-pill.done .n { background: #2F5D3F; border-color: #2F5D3F; color: white; }
  .step-pill.active { background: var(--text-dark); color: white; font-weight: 700; } .step-pill.active .n { border-color: rgba(255,255,255,.5); }
  .content { flex: 1; overflow-y: auto; padding: 18px 22px 24px; position: relative; }
  .gate { position: absolute; inset: 0; background: rgba(255,255,255,.8); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 20; transition: opacity .3s; padding: 20px; text-align: center; }
  .gate.hidden { opacity: 0; pointer-events: none; }
  .gate-kind { font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--terra); }
  .gate-title { font-size: 18px; font-weight: 800; }
  .gate-sub { font-size: 12px; color: var(--text-muted); max-width: 300px; line-height: 1.6; }
  .gate-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .start-btn { background: linear-gradient(135deg, #F59A65, #C97142); color: white; border: none; border-radius: 100px; padding: 12px 24px; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 18px rgba(245,154,101,.35); display: flex; align-items: center; gap: 8px; }
  .start-btn.alt { background: var(--white); color: var(--text-mid); border: 1.5px solid var(--border); box-shadow: none; }
  .panel:not(.live) .blurable { filter: blur(4px); opacity: .5; pointer-events: none; user-select: none; }

  .eyebrow { font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
  .headline { font-size: 20px; font-weight: 800; line-height: 1.25; margin-bottom: 12px; }
  .tp { background: var(--cream); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; }
  .tp-text { font-size: 13.5px; font-weight: 500; line-height: 1.55; font-style: italic; }
  .tp-text em { font-style: normal; font-weight: 800; color: var(--terra); }
  .field { margin-bottom: 18px; }
  .field-label { font-size: 12.5px; font-weight: 700; color: var(--text-mid); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .yn { display: flex; gap: 8px; }
  .yn-btn { flex: 1; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid; transition: all .15s; }
  .yn-yes { background: var(--green-bg); color: #2F5D3F; border-color: rgba(74,155,127,.35); }
  .yn-yes.sel, .yn-yes:hover { background: #2F5D3F; color: white; border-color: #2F5D3F; }
  .yn-no { background: var(--cream); color: var(--text-muted); border-color: var(--border); }
  .yn-no.sel, .yn-no:hover { background: var(--cream-2); color: var(--text-dark); border-color: var(--text-faint); }
  .yn-red.sel { background: #FDE3E0; color: var(--red); border-color: rgba(194,78,66,.5); }
  .opt-grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 100px; border: 1.5px solid var(--border); background: var(--white); font-size: 12.5px; font-weight: 600; color: var(--text-mid); cursor: pointer; }
  .opt:hover { border-color: var(--text-faint); }
  .opt.sel { background: var(--terra-bg); border-color: var(--terra); color: #8A431A; }
  .opt .was { font-size: 8.5px; font-weight: 700; color: var(--terra); background: white; padding: 1px 6px; border-radius: 100px; }
  .add-row { display: flex; gap: 8px; }
  .add-input { flex: 1; min-width: 0; height: 42px; padding: 0 13px; border-radius: 11px; border: 1.5px dashed var(--border); background: var(--cream); font-size: 13px; outline: none; }
  .add-input:focus { border-color: var(--terra); border-style: solid; background: white; }
  .add-btn { height: 42px; padding: 0 15px; border-radius: 11px; border: none; background: var(--terra-bg); color: var(--terra); font-size: 13px; font-weight: 700; cursor: pointer; }

<script>
/* ═══════════ CONFIG — shaped like content/meetings.ts (§6.3) ═══════════ */

  $('board').innerHTML = STAGES.map((s, i) => {
    const list = visible().filter(c => c.stage === s[0]);
    return `<div class="col"><div class="col-head"><div class="col-num">${i + 1}</div><div class="col-title">${s[1]}${s[3] ? `<small>${s[3]}</small>` : ''}</div><div class="col-count">${list.length}</div></div>
      <div class="cards">${list.map(cardHTML).join('') || '<div class="col-empty">No one here</div>'}</div></div>`;
  }).join('');
  $('board').querySelectorAll('.lead-card').forEach(el => el.onclick = () => openPanel(+el.dataset.id));
}
function renderList() {
  $('list').innerHTML = `<table class="table"><thead><tr><th>Candidate</th><th>Territory</th><th>Stage</th><th>Days in stage</th><th>Next meeting</th><th>Status</th></tr></thead><tbody>
    ${visible().sort((a, b) => STAGES.findIndex(s => s[0] === b.stage) - STAGES.findIndex(s => s[0] === a.stage)).map(c => `<tr data-id="${c.id}">
      <td><div class="nm"><div class="lead-avatar">${c.initials}</div>${c.name}</div></td><td>${c.territory}</td>
      <td><span class="stage-chip">${stageOf(c.stage)[1]}</span></td><td>${c.days}</td><td>${c.next || '—'}</td>
      <td><span class="pill a-${c.action[0]}"><span class="dot"></span>${c.action[1]}</span></td></tr>`).join('')}</tbody></table>`;
  $('list').querySelectorAll('tbody tr').forEach(el => el.onclick = () => openPanel(+el.dataset.id));
}
function setView(v) {
  view = v; $('vKanban').classList.toggle('active', v === 'kanban'); $('vList').classList.toggle('active', v === 'list');
  $('board').style.display = v === 'kanban' ? 'flex' : 'none'; $('list').style.display = v === 'list' ? 'block' : 'none';
  v === 'kanban' ? renderBoard() : renderList();
}
$('vKanban').onclick = () => setView('kanban'); $('vList').onclick = () => setView('list');
$('search').oninput = e => { q = e.target.value.toLowerCase(); setView(view); };

/* ═══════════ PANEL ═══════════ */
let cand = null, kind = null, stepIdx = 0, live = false, remaining = 0, timerId = null, answers = {}, wrap = {};
const M = () => MEETINGS[kind];
const steps = () => [...M().agenda, { key: '__wrap', label: M().nextKind ? 'Decide + book next' : 'Decide' }];
const fill = s => s.replace(/\{(\w+)\}/g, (_, k) => cand[k] ?? '');

function openPanel(id) {
  cand = CANDIDATES.find(c => c.id === id);
  kind = stageOf(cand.stage)[2] || 'intro';
  stepIdx = 0; answers = {}; wrap = {}; live = false; clearInterval(timerId);
  remaining = M().lengthMin * 60; paintTimer();
  $('panel').classList.remove('live'); $('gate').classList.remove('hidden'); $('notes').value = '';
  $('phAvatar').textContent = cand.initials; $('phName').textContent = cand.name;
  $('phSub').textContent = `${stageOf(cand.stage)[1]} · ${cand.territory} · day ${cand.totalDays}`;
  $('gateKind').textContent = cand.next ? 'Next: ' + cand.next : 'Nothing booked yet';
  $('gateTitle').textContent = 'Start ' + M().label;
  document.querySelectorAll('.lead-card').forEach(el => el.classList.toggle('sel', +el.dataset.id === id));
  renderInfo(); renderStep();
  $('panel').classList.add('open'); $('scrim').classList.add('on');
}
function closePanel() { $('panel').classList.remove('open'); $('scrim').classList.remove('on'); clearInterval(timerId); document.querySelectorAll('.lead-card.sel').forEach(el => el.classList.remove('sel')); }
$('closeX').onclick = closePanel; $('scrim').onclick = closePanel;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* LEFT — info only */
function renderInfo() {
  const c = cand, items = Object.values(answers);
  $('ansCount').textContent = items.length;
  let h = `<div><div class="sec-label">This call <span class="badge live">${items.length} captured</span></div>
    ${items.length ? items.map(a => `<div class="ans"><div class="ans-q"><span>${a.label}</span><span class="dest ${a.writes.startsWith('deals.') ? 'fact' : 'said'}">${a.writes.startsWith('deals.') ? 'DEAL' : 'NOTE'}</span></div><div class="ans-a">${esc(a.value)}</div></div>`).join('')
      : '<div class="empty">What you capture on the right shows up here.</div>'}</div>`;
  if (c.homework) {
    h += `<div><div class="sec-label">Homework <span class="badge ok">Submitted</span></div><div class="card">${c.homework.map(([qq, a]) => `<div class="hw-q">${qq}</div><div class="hw-a">${a}</div>`).join('')}</div></div>`;
    h += `<div class="card"><div class="kv"><span>${c.video[0]}</span><span>${c.video[1]}%</span></div><div class="bar"><i style="width:${c.video[1]}%"></i></div></div>`;
  }
  if (c.last) h += `<div><div class="sec-label">Last call</div><div class="card" style="font-size:12px;line-height:1.55;color:var(--text-mid)">${c.last}</div></div>`;
  if (c.facts) h += `<div><div class="sec-label">${c.homework ? 'On the deal' : 'From their booking'}</div><div class="card">${c.facts.map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}</div></div>`;
  if (c.market) h += `<div><div class="sec-label">${c.territory}</div><div class="card">${c.market.map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}</div></div>`;
  if (c.activity) h += `<div><div class="sec-label">Recent activity</div><div class="card"><ul class="feed">${c.activity.map(([t, d]) => `<li>${t}<small>${d}</small></li>`).join('')}</ul></div></div>`;
  if (!c.facts) h += `<div class="card empty">Sample card. Full info shows for Marcus Bell (Intro Call) and Priya Raman (Meeting 1).</div>`;
  $('info').innerHTML = h;
}

/* RIGHT — what you do */
function renderSteps() {
  $('steps').innerHTML = steps().map((s, i) => {
    const done = s.key !== '__wrap' && s.captures.some(c => answers[s.key + '.' + c.key]);
    return `<button class="step-pill ${i === stepIdx ? 'active' : done ? 'done' : ''}" data-i="${i}"><span class="n">${done && i !== stepIdx ? '✓' : i + 1}</span>${s.label}</button>`;
  }).join('');
  $('steps').querySelectorAll('.step-pill').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('steps').querySelector('.active')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  $('prevBtn').classList.toggle('invisible', stepIdx === 0);
  $('nextBtn').classList.toggle('invisible', stepIdx === steps().length - 1);
  $('bottomMid').textContent = `${stepIdx + 1} of ${steps().length}`;
}
function renderStep() {
  const s = steps()[stepIdx];
  if (s.key === '__wrap') { $('stepHost').innerHTML = wrapHTML(); bindWrap(); renderSteps(); return; }
  $('stepHost').innerHTML = `<div class="eyebrow blurable">${s.label}</div><div class="headline blurable">${fill(s.headline)}</div>
    <div class="tp blurable"><div class="tp-text">${fill(s.talk)}</div></div>${s.captures.map(c => captureHTML(s, c)).join('')}`;
  bindCaptures(s); renderSteps();
}
function captureHTML(s, c) {
  const id = s.key + '.' + c.key, cur = answers[id]?.value;
  let inner = '';
  if (c.type === 'choice') { const was = c.prefillFrom ? cand[c.prefillFrom] : null; inner = `<div class="opt-grid">${c.options.map(o => `<button class="opt ${cur === o ? 'sel' : ''}" data-v="${o}">${o}${o === was ? '<span class="was">REPORTED</span>' : ''}</button>`).join('')}</div>`; }
  if (c.type === 'yn') inner = `<div class="yn"><button class="yn-btn yn-yes ${cur === c.yes ? 'sel' : ''}" data-v="${c.yes}">${c.yes}</button><button class="yn-btn yn-no ${cur === c.no ? 'sel' : ''}" data-v="${c.no}">${c.no}</button></div>`;
  if (c.type === 'chips') { const list = cur ? cur.split(' · ') : []; inner = `<div class="add-row"><input class="add-input" placeholder="${c.placeholder || ''}"><button class="add-btn">Add</button></div><div class="chips">${list.map((t, i) => `<span class="chip">${esc(t)}<button data-i="${i}">✕</button></span>`).join('')}</div>`; }
  if (c.type === 'confirm') inner = `<button class="confirm ${cur ? 'sel' : ''}"><span class="box">✓</span>${c.text}</button>`;
  return `<div class="field blurable" data-cap="${c.key}"><div class="field-label">${fill(c.label)}</div>${inner}</div>`;
}
function bindCaptures(s) {
  s.captures.forEach(c => {
    const el = $('stepHost').querySelector(`[data-cap="${c.key}"]`), id = s.key + '.' + c.key;
    const set = v => { if (v) answers[id] = { label: fill(c.label), value: v, writes: c.writes }; else delete answers[id]; renderInfo(); renderStep(); };
    if (c.type === 'choice' || c.type === 'yn') el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => set(answers[id]?.value === b.dataset.v ? null : b.dataset.v));
    if (c.type === 'confirm') el.querySelector('.confirm').onclick = () => set(answers[id] ? null : 'Yes');
    if (c.type === 'chips') {
      const inp = el.querySelector('.add-input'), list = () => answers[id]?.value ? answers[id].value.split(' · ') : [];
      const add = () => { const v = inp.value.trim(); if (!v) return; set([...list(), v].join(' · ')); setTimeout(() => $('stepHost').querySelector(`[data-cap="${c.key}"] .add-input`)?.focus(), 0); };
      el.querySelector('.add-btn').onclick = add; inp.onkeydown = e => { if (e.key === 'Enter') add(); };
      el.querySelectorAll('.chip button').forEach(b => b.onclick = () => { const l = list(); l.splice(+b.dataset.i, 1); set(l.join(' · ')); });
    }
  });
}

/* Wrap-up */
function wrapHTML() {
  const m = M(), next = m.nextKind ? MEETINGS[m.nextKind] : null, o = wrap.outcome, d = wrap.decision;
  let h = `<div class="eyebrow blurable">Wrap up</div><div class="headline blurable">${o === 'No-show' ? 'They didn\'t show.' : next ? 'Decide, then book ' + next.label.split('·')[0].trim() + '.' : 'Decide the outcome.'}</div>
    <div class="field blurable"><div class="field-label">Outcome</div><div class="yn">${['Held', 'No-show', 'Reschedule'].map(x => `<button class="yn-btn ${x === 'Held' ? 'yn-yes' : x === 'No-show' ? 'yn-no yn-red' : 'yn-no'} ${o === x ? 'sel' : ''}" data-out="${x}">${x}</button>`).join('')}</div></div>`;
  if (o === 'No-show') return h + `<div class="result bad blurable"><h4>No-show</h4><p>${cand.name.split(' ')[0]} gets the "pick a new time" email and text. The deal stays where it is.</p></div>`;
  if (o === 'Reschedule') return h + slotsHTML('New time for this ' + m.label, 'Reschedule');
  if (o !== 'Held') return h;
  h += `<div class="field blurable"><div class="field-label">Decision</div><div class="opt-grid">${m.decisions.map(k => `<button class="opt ${d === k ? 'sel' : ''}" data-dec="${k}">${DECISIONS[k].label}</button>`).join('')}</div></div>`;
  if (d === 'advance' && next) h += wrap.booked ? `<div class="result good blurable"><h4>${next.label} booked</h4><ul><li>${wrap.bookedLabel} · invite sent with a Meet link</li><li>Card moves to ${stageOf(STAGES.find(s => s[2] === m.nextKind)[0])[1]}</li><li>Their portal unlocks the next video + homework</li></ul></div>` : slotsHTML(next.label + ' · ' + next.lengthMin + ' min', 'Book ' + next.label.split('·')[0].trim());
  if (d === 'advance' && !next) h += `<div class="result good blurable"><h4>Ready for award</h4><p>Card moves to Preparing To Accept Award.</p></div>`;
  if (DECISIONS[d]?.lost) { const r = wrap.lostReason || DECISIONS[d].lost;
    h += `<div class="field blurable"><div class="field-label">Lost reason</div><select class="select" id="lostSel">${LOST_REASONS.map(x => `<option ${x === r ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      ${wrap.lost ? `<div class="result bad blurable"><h4>Marked Lost · ${r}</h4><p>Card leaves the board.</p></div>` : `<button class="primary danger blurable" id="lostBtn">Mark Lost</button>`}`; }
  if (d === 'think_it_over') h += `<div class="result neutral blurable"><h4>Stays in this stage</h4><p>Shows as stalled after ${m.stalledAfterDays} days with nothing booked. Their portal offers "Book your next meeting".</p></div>`;
  return h;
}
function slotsHTML(label, btn) {
  const days = []; for (let d = new Date(2026, 10, 9); days.length < 6; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) days.push(new Date(d));
  const sel = wrap.day ?? 1, times = ['9:00 AM', '10:00 AM', '11:00 AM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM'];
  return `<div class="field blurable"><div class="field-label">${label}</div>
    <div class="days">${days.map((d, i) => `<button class="day ${i === sel ? 'sel' : ''}" data-day="${i}"><div class="dw">${d.toLocaleDateString('en-US', { weekday: 'short' })}</div><div class="dn">${d.getDate()}</div></button>`).join('')}</div>
    <div class="times">${times.map((t, j) => `<button class="time ${wrap.time === t ? 'sel' : ''}" data-time="${t}" ${(sel * 3 + j) % 4 === 0 ? 'disabled' : ''}>${t}</button>`).join('')}</div>
    <button class="primary" id="bookBtn" ${wrap.time ? '' : 'disabled'}>${btn}${wrap.time ? ' · ' + days[sel].toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + wrap.time : ''}</button></div>`;
}
function bindWrap() {
  const host = $('stepHost');
  host.querySelectorAll('[data-out]').forEach(b => b.onclick = () => { wrap = { outcome: wrap.outcome === b.dataset.out ? null : b.dataset.out }; renderStep(); });
  host.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { wrap = { outcome: wrap.outcome, decision: b.dataset.dec }; renderStep(); });
  host.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { wrap.day = +b.dataset.day; wrap.time = null; renderStep(); });
  host.querySelectorAll('[data-time]').forEach(b => b.onclick = () => { wrap.time = b.dataset.time; renderStep(); });
  const bb = $('bookBtn'); if (bb) bb.onclick = () => { wrap.booked = true; wrap.bookedLabel = bb.textContent.split(' · ').slice(1).join(' · '); renderStep(); };
  const ls = $('lostSel'); if (ls) ls.onchange = () => { wrap.lostReason = ls.value; };
  const lb = $('lostBtn'); if (lb) lb.onclick = () => { wrap.lostReason = $('lostSel').value; wrap.lost = true; renderStep(); };
}

/* Timer + nav */
function paintTimer() { const t = $('timer'), over = remaining < 0, a = Math.abs(remaining);
  t.textContent = (over ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
  t.classList.toggle('idle', !live); t.classList.toggle('warn', live && !over && remaining <= 300); t.classList.toggle('over', over); }
function start() { live = true; $('panel').classList.add('live'); $('gate').classList.add('hidden'); clearInterval(timerId); timerId = setInterval(() => { remaining--; paintTimer(); }, 1000); paintTimer(); }
function go(i) { stepIdx = Math.max(0, Math.min(steps().length - 1, i)); renderStep(); $('content').scrollTop = 0; }
$('prevBtn').onclick = () => go(stepIdx - 1); $('nextBtn').onclick = () => go(stepIdx + 1);
$('startMeet').onclick = start; $('startPhone').onclick = start;
let saveT; $('notes').oninput = () => { $('savedFlag').classList.remove('on'); clearTimeout(saveT); saveT = setTimeout(() => $('savedFlag').classList.add('on'), 600); };
$('ptabs').querySelectorAll('.ptab').forEach(t => t.onclick = () => { $('pbody').dataset.pane = t.dataset.pane; $('ptabs').querySelectorAll('.ptab').forEach(x => x.classList.toggle('active', x === t)); });

/* Demo toolbar */
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  $('stage').classList.toggle('framed', b.dataset.view === 'phone');
});
$('jumpWarn').onclick = () => { if (!cand) openPanel(1); if (!live) start(); remaining = 270; paintTimer(); };
$('jumpOver').onclick = () => { if (!cand) openPanel(1); if (!live) start(); remaining = -45; paintTimer(); };

renderKpis(); setView('kanban');
</script>
</body>
</html>
